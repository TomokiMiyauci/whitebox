name: Publish

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish (branch, tag, or commit SHA; e.g. refs/heads/main, refs/tags/v1.0.0, or 0abcdef...)
        type: string
        required: true

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Publish to JSR
        run: bun x jsr publish
