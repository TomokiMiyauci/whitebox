name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7

  #     - name: Setup Bun
  #       uses: oven-sh/setup-bun@v2

  #     - name: Install dependencies
  #       run: bun install

  #     - name: Lint
  #       run: deno lint
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type Check
        run: bun check

  test:
    permissions:
      code-quality: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply patch
        run: bun run apply-patch

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov

      - name: Convert coverage
        run: |
          bunx @splicemood/lcov-to-cobertura \
            coverage/lcov.info \
            -o coverage/cobertura.xml

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura.xml
          language: TypeScript
