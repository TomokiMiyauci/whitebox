name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Format Check
        uses: devcontainers/ci@v0.3
        with:
          runCmd: task check:fmt

  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7

  #     - name: Setup Bun
  #       uses: oven-sh/setup-bun@v2

  #     - name: Install dependencies
  #       run: bun install

  #     - name: Lint
  #       run: deno lint
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Format Check
        uses: devcontainers/ci@v0.3
        with:
          runCmd: task check:type

  test:
    permissions:
      pull-requests: write
      checks: write # required for line annotations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            task apply-patch 
            task test:coverage COVERAGE_DIR=coverage

      - name: Coverage report
        uses: scttnlsn/covrs@v0
        with:
          coverage-files: coverage/lcov.info
          annotate: true
