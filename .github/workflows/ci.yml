name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7

  #     - name: Setup Bun
  #       uses: oven-sh/setup-bun@v2

  #     - name: Install dependencies
  #       run: bun install

  #     - name: Lint
  #       run: deno lint
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type Check
        run: bun check

  test:
    permissions:
      pull-requests: write
      checks: write # required for line annotations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply patch
        run: bun run apply-patch

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov

      - name: Coverage report
        uses: scttnlsn/covrs@v0
        with:
          coverage-files: coverage/icov.info
          annotate: true
